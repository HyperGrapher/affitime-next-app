name: Deploy CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  buildAndTest:
    name: Build and test
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        node-version: [18.x]
        os: [ubuntu-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [buildAndTest]

    steps:
      - name: Deploying after build/test CI
        run: |
          echo "Now Deploying..."
          sleep 5s;
          echo "Deployment Done!"
