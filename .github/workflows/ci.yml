name: CI

# Runs on pull requests (so a change is tested BEFORE it reaches main, which Vercel deploys to production),
# on pushes to main/dev, and manually. Needs no secrets: tests use a throwaway Postgres service container.
# The steps live in .github/actions/{setup,verify} and are shared with the dependency-update workflow.
# To block merging untested code, mark the "test" check as required in Settings -> Branches (main).
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://affitime:affitime@localhost:5432/affitime
  DIRECT_URL: postgresql://affitime:affitime@localhost:5432/affitime
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  PAYMENT_WEBHOOK_SECRET: ci-payment-secret
  CRON_SECRET: ci-cron-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DEMO_MODE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: affitime
          POSTGRES_PASSWORD: affitime
          POSTGRES_DB: affitime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U affitime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/verify
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
