name: Setup toolchain
description: Node 22 with the npm cache, then `npm ci`. Run after actions/checkout.
inputs:
  install:
    description: Run `npm ci` (set to "false" when the job installs dependencies itself)
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci
