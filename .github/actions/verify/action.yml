name: Verify
description: >-
  Type check, lint, unit + integration tests, migrations with a schema-drift guard, seed, production build and
  end-to-end tests. The workflow must provide the env block (a throwaway Postgres at DATABASE_URL, never a real
  database) and have the dependencies installed.
runs:
  using: composite
  steps:
    - name: Type check
      shell: bash
      run: npm run typecheck

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Migrate the test database and check the migrations match the schema
      shell: bash
      run: |
        npx prisma migrate deploy
        # Fails (exit 2) when prisma/schema.prisma has changes that no migration in prisma/migrations covers.
        npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

    - name: Unit + integration tests
      shell: bash
      run: npm test

    - name: Seed demo data (needed by the e2e tests)
      shell: bash
      run: npm run db:seed

    - name: Cache Next.js build cache
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

    - name: Production build
      shell: bash
      run: npm run build

    - name: Install Playwright browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: End-to-end tests (against the production build)
      shell: bash
      env:
        CI: "true"
      run: npm run test:e2e
